# Stage 2: LoRA on the body + the new rows (PLAN.md §3). Start from the stage-1 export.
stage: 2
model_path: checkpoints/mistral-7b-vi-stage1      # export/export_hf.py of runs/stage1/final
first_new_id: 32000

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  mix: data/mix.yaml
  eval_langs: [vi, en, fr, de, es, it]
  eval_docs_per_lang: 50

training:
  output_dir: runs/stage2
  lr: 2.0e-5
  scheduler: cosine
  warmup_ratio: 0.02
  weight_decay: 0.0                                # decay would shrink the frozen Mistral rows (gradient is masked, decay is not)
  max_steps: 15000                                 # 15k x 16 x 4096 ≈ 1 B tokens on one A100; scale with GPUs
  micro_batch: 1
  grad_accum: 16
  grad_clip: 1.0
  bf16: true
  gradient_checkpointing: true
  attn_implementation: null                        # "flash_attention_2" on the GPU box
  eval_steps: 500
  save_steps: 1000
  log_steps: 10
  seed: 42
